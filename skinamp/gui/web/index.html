<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Skinamp</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="window">
      <header class="titlebar">Skinamp</header>
      <div class="body">
        <section class="themes" id="themes" aria-label="Themes"></section>

        <section class="status" role="status" aria-live="polite">
          <strong id="status-title"></strong>
          <p id="status-detail"></p>
        </section>

        <div id="update" class="update" hidden>
          <span id="update-text"></span>
          <button id="restart" type="button">Restart and update</button>
        </div>

        <small id="version"></small>
      </div>
    </main>
    <script src="app.js"></script>
  </body>
</html>
